font=Hack Nerd Font Mono:size=14
include=~/.config/palette/generated/fuzzel.ini
use-bold=yes
dpi-aware=no
prompt="Search  "
icons-enabled=no
fields=name,generic,keywords
filter-desktop=yes
match-mode=fzf
sort-result=yes
show-actions=no
terminal=wezterm start --

anchor=center
lines=5
minimal-lines=no
width=44
horizontal-pad=12
vertical-pad=8
inner-pad=6
line-height=36
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=no
enable-mouse=yes

[border]
width=2
radius=0
selection-radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
