# Minimal compositor configuration: prevent tearing without adding effects.
backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
inactive-opacity = 0.94;
active-opacity = 0.98;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
	"100:window_type = 'dock'",
	"100:window_type = 'desktop'",
	"100:fullscreen",
	"100:class_g = 'i3lock'"
];

# A tiny radius softens i3's pixel borders without adding shadows/fades.
corner-radius = 12;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"fullscreen"
];

# Keep fullscreen windows composited so VSync remains active.
unredir-if-possible = false;
