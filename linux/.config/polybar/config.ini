include-file = colors.ini

[bar/base]
monitor = ${env:MONITOR}
width = 100%
height = 30
fixed-center = true
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-bottom-size = 1
border-color = ${colors.background-alt}
padding-left = 2
padding-right = 2
module-margin = 1
separator = ·
separator-foreground = ${colors.muted}
font-0 = Hack Nerd Font Mono:size=9;2
font-1 = Hack Nerd Font Mono:size=11;2
modules-left = date
modules-center = i3
modules-right = ${env:POLYBAR_RIGHT}
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

[bar/external]
inherit = bar/base
monitor-strict = true

[bar/laptop]
inherit = bar/base
monitor-strict = true
height = 44
font-0 = Hack Nerd Font Mono:size=16;3
font-1 = Hack Nerd Font Mono:size=18;3

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state>
label-focused = %index%
label-focused-foreground = ${colors.highlight}
label-focused-underline = ${colors.highlight}
label-focused-padding = 1
label-visible = %index%
label-visible-foreground = ${colors.accent}
label-visible-underline = ${colors.accent}
label-visible-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1
label-occupied = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-empty = %index%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-underline = ${colors.urgent}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M:%S
label = %date%  %time%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = custom/script
exec = ~/.local/bin/i3-osd volume-status
interval = 1
format-foreground = ${colors.foreground}
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5
format-charging = <label-charging>
label-charging = 󰂄 %percentage%%
label-charging-foreground = ${colors.ok}
format-discharging = <label-discharging>
label-discharging = 󰁹 %percentage%%
label-discharging-foreground = ${colors.foreground}
format-full = <label-full>
label-full = 󰁹 full
label-full-foreground = ${colors.ok}
format-low = <label-low>
label-low = 󰂃 %percentage%%
label-low-foreground = ${colors.urgent}
low-at = 20

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%
label-foreground = ${colors.subtle}

[module/memory]
type = internal/memory
interval = 5
label = RAM %percentage_used%%
label-foreground = ${colors.subtle}

[module/tray]
type = internal/tray
format-background = ${colors.background}
tray-background = ${colors.background}
tray-foreground = ${colors.muted}
tray-padding = 2px
tray-spacing = 6px
tray-size = 58%
