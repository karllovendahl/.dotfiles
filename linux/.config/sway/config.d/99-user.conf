# Personal Sway overrides layered on Fedora's maintained Sway configuration.

# Match the fast keyboard repeat used in GNOME.
input type:keyboard {
    repeat_delay 140
    repeat_rate 40
}

# Omarchy-style window controls.
unbindsym $mod+w
bindsym $mod+w kill
bindsym $mod+t floating toggle

# Use the existing terminal configuration.
unbindsym $mod+Return
bindsym $mod+Return exec wezterm

# Lock without ending the Sway session.
bindsym $mod+Escape exec swaylock -f
