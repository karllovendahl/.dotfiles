# Personal Sway overrides layered on Fedora's maintained configuration.

font pango:Hack Nerd Font Mono 10
focus_follows_mouse no

# A clear outline marks the focused window; palette-apply generates its
# colours from the canonical ink-paper palette without adding title-bar chrome.
default_border pixel 3
default_floating_border pixel 3
include ~/.config/palette/generated/sway.conf
gaps inner 8
gaps outer 0
smart_gaps off

# Keep the wallpaper just visible through application windows. Native Sway
# applies opacity per view rather than changing it dynamically with focus.
for_window [shell="xdg_shell"] opacity 0.96
for_window [shell="xwayland"] opacity 0.96

input type:keyboard {
    xkb_layout dk
    repeat_delay 140
    repeat_rate 40
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# Keep every output at its native mode and scale. The display-layout helper
# identifies the one active external output without relying on its connector or
# EDID, places it above eDP-1, and assigns workspaces 1–4 to it.
output * scale 1
output * bg $HOME/Pictures/wallpapers/wallpaper_icy.jpg fill
workspace 5 output eDP-1
exec_always --no-startup-id $HOME/.local/bin/sway-display-layout

# Never disable the internal panel on lid close. If an external display is
# unplugged while the lid is closed, Sway must retain an active output; gtklock
# 4.0.0 also crashes when every output disappears. Logind owns suspension.

# Omarchy-style application and window controls.
unbindsym $mod+Return
unbindsym $mod+d
unbindsym $mod+w
unbindsym $mod+space
unbindsym $mod+Shift+q
unbindsym $mod+Shift+space
bindsym $mod+Return exec wezterm
bindsym $mod+space exec sh -c 'pkill -x fuzzel || exec fuzzel'
bindsym $mod+Escape exec loginctl lock-session

# Keep screenshots on disk and copy the PNG to the Wayland clipboard.
unbindsym Print
unbindsym Alt+Print
unbindsym Ctrl+Print
bindsym Print exec grimshot savecopy output
bindsym Alt+Print exec grimshot savecopy active
bindsym Ctrl+Print exec grimshot savecopy area
bindsym $mod+Shift+s exec grimshot savecopy area

bindsym $mod+w kill
bindsym $mod+t floating toggle

# Move a window and follow it to the destination workspace.
unbindsym $mod+Shift+1
unbindsym $mod+Shift+2
unbindsym $mod+Shift+3
unbindsym $mod+Shift+4
unbindsym $mod+Shift+5
unbindsym $mod+Shift+6
unbindsym $mod+Shift+7
unbindsym $mod+Shift+8
unbindsym $mod+Shift+9
unbindsym $mod+Shift+0
bindsym $mod+Shift+1 move container to workspace number 1; workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2; workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3; workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4; workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5; workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6; workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7; workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8; workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9; workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10; workspace number 10

# ThinkPad star-key media cluster.
bindsym XF86Favorites exec playerctl play-pause
bindsym Shift+XF86Favorites exec playerctl next
bindsym Mod1+Shift+XF86Favorites exec playerctl previous
