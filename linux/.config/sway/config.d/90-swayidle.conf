# Replace Fedora's swaylock command while preserving its idle, display-power,
# logind lock, and before-sleep behavior.
exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT '$HOME/.local/bin/sway-lock-safe' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"' \
        timeout $ST 'if pgrep -xu "$USER" "^(gtklock|swaylock)$" >/dev/null; then swaymsg "output * power off"; fi' \
             resume 'swaymsg "output * power on"' \
        before-sleep '$HOME/.local/bin/sway-lock-safe' \
        lock '$HOME/.local/bin/sway-lock-safe' \
        unlock 'pkill -xu "$USER" -TERM gtklock; pkill -xu "$USER" -SIGUSR1 swaylock'
