# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# THEME / powerkit
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_theme 'custom'
set -g @powerkit_theme_variant 'custom'
set -g @powerkit_custom_theme_path '~/.config/tmux/theme.sh'
source-file -q ~/.config/theme/current/tmux.conf
set -g @powerkit_separator_style 'slantup'
set -g @powerkit_plugin_no_icon_bg_style 'content'
set -g @powerkit_status_justify "absolute-centre"
# Let tmux centre the window list across the whole terminal, not the space left after #S.
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_bar_layout "single"
set -g @powerkit_edge_separator_style "slantup"
set -g @powerkit_session_icon ""

setw -g mode-keys vi

# KEYBINDS
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Switch back to latest session
bind j switch-client -l

# Set keybind for going to copy mode
bind k copy-mode


# Ressurect & Continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Auto ressurect tmux session on tmux start 
set -g @continuum-restore 'on'

set -g @plugin "tmux-plugins/tmux-yank"


# Start counting pane and window number at 1
set -g base-index 1
setw -g pane-base-index 1

set -g status-position top

# TMUX ssh split 
set -g @plugin 'pschmitt/tmux-ssh-split'

set-option -g @ssh-split-h-key "H"
set-option -g @ssh-split-v-key "V"

bind r source-file ~/.config/tmux/tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
# Centre the window list across the whole terminal, like the Waybar workspaces,
# and fix the session slant powerkit draws for a left-aligned list.
run '~/.config/tmux/powerkit-finish.sh'
