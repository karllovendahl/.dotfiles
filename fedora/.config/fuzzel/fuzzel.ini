font=Hack Nerd Font Mono:size=14
include=~/.config/theme/current/fuzzel.ini
use-bold=yes
dpi-aware=no
prompt="  "
placeholder="Search applications"
icon-theme=Adwaita
icons-enabled=yes
fields=name,generic,keywords,comment
filter-desktop=yes
match-mode=fzf
sort-result=yes
show-actions=no
terminal=wezterm start --

anchor=center
lines=8
minimal-lines=yes
width=48
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=34
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=no
enable-mouse=yes

[border]
width=2
radius=0
selection-radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
